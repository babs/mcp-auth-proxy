name: vuln

# Own workflow, not a job in ci.yml: the vulndb moves without commits,
# so this also runs on a schedule — and a schedule on ci.yml would
# re-run the whole build/fuzz/e2e matrix for nothing.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        # Pinned for reproducibility — dependabot cannot bump a `go
        # install` line, so this one is bumped by hand.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck ./...
        # Fails on any known-exploitable vulnerability in the module
        # graph or the Go toolchain itself. Queries vuln.go.dev.
        run: govulncheck ./...
