name: vuln

# Own workflow, not a job in ci.yml: the vulndb moves without commits,
# so this also runs on a schedule — and a schedule on ci.yml would
# re-run the whole build/fuzz/e2e matrix for nothing.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        # Pinned for reproducibility — dependabot cannot bump a `go
        # install` line, so this one is bumped by hand.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck ./...
        # Fails on any known-exploitable vulnerability in the module
        # graph or the Go toolchain itself. Queries vuln.go.dev.
        run: govulncheck ./...
