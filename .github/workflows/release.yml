name: "Build OCI Image"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

env:
  REPOS: "ghcr.io/babs/mcp-auth-proxy"

jobs:
  build-image:
    name: "Build OCI image"
    runs-on: ${{ matrix.os }}
    # Build job only reads source and pushes images — no release creation
    # happens here, so contents:read is sufficient.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    outputs:
      RAW_IMG_TAGS: ${{ steps.define-targets.outputs.RAW_IMG_TAGS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Define TARGETS
        id: define-targets
        run: |
          PLATFORM=${{ matrix.platform }}
          PLATFORM_PAIR=${PLATFORM//\//-}
          echo "PLATFORM_PAIR=$PLATFORM_PAIR" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          IMG_TAGS="latest"

          if [ ${GITHUB_REF_TYPE:-} == 'tag' -a -n "$(echo $GITHUB_REF_NAME | grep -iE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$')" ]; then
            TAG=${GITHUB_REF_NAME#v}
            RELEASE=""
            case "$TAG" in
              *-*)
                RELEASE="-${TAG#*-}"
                ;;
            esac
            SEMVER_CORE="${TAG%%-*}"
            IMG_TAGS="${IMG_TAGS} $TAG ${SEMVER_CORE%.*}${RELEASE} ${SEMVER_CORE%%.*}${RELEASE}"
          fi
          echo RAW_IMG_TAGS="$IMG_TAGS" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          echo "Targets:"
          TARGETS=""
          PLATFORM_TAGS=""
          for REPO in $REPOS; do
            for IMG_TAG in $IMG_TAGS; do
              PLATFORM_TAGS="${PLATFORM_TAGS},${IMG_TAG}-$PLATFORM_PAIR"
              TARGETS="${TARGETS},${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
              echo "- ${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
            done
          done
          echo PLATFORM_TAGS=${PLATFORM_TAGS#,} | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV
          echo TARGETS=${TARGETS#,} | tee -a $GITHUB_OUTPUT >>$GITHUB_ENV

          MODULE=$(grep module go.mod | cut -d\  -f2)
          BINBASE=${MODULE##*/}
          VERSION=${VERSION:-$GITHUB_REF_NAME}
          VERSION=${VERSION:-v0.0.0}
          COMMIT_HASH="$(git rev-parse --short HEAD 2>/dev/null)"
          COMMIT_HASH=${COMMIT_HASH:-00000000}
          DIRTY=$(git diff --quiet 2>/dev/null || echo '-dirty')
          BUILD_TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          echo "VERSION=${VERSION}" | tee -a $GITHUB_OUTPUT >>$GITHUB_ENV
          echo "COMMIT_HASH=${COMMIT_HASH}${DIRTY}" | tee -a $GITHUB_OUTPUT >>$GITHUB_ENV
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" | tee -a $GITHUB_OUTPUT >>$GITHUB_ENV

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            PROJECT_URL=${{ github.event.repository.html_url }}
            VERSION=${{ env.VERSION }}
            BUILDER=github-actions/${{ runner.os }}-${{ runner.arch }}
          # GHA cache scoped per-platform so amd64 and arm64 don't
          # evict each other's layers in the shared cache backend.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          push: true
          tags: ${{ env.TARGETS }}
          platforms: ${{ matrix.platform }}
          # Enable supply-chain attestations: SLSA provenance + SBOM
          # embedded in the OCI image index. Consumers can verify with
          # `docker buildx imagetools inspect <image> --format '{{json
          # .Provenance}}'` and `cosign download sbom`.
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "✅ Docker image created:" | tee -a $GITHUB_STEP_SUMMARY
          for TGT in ${TARGETS//,/\ }; do
            echo " - $TGT" | tee -a $GITHUB_STEP_SUMMARY
          done

  merge-images:
    name: "Merge platform images into one"
    needs: build-image
    runs-on: ubuntu-latest
    # contents:write is required to create the GitHub Release below.
    # packages:write lets imagetools and cosign push into GHCR.
    # id-token:write is required for cosign keyless signing (Fulcio
    # needs the OIDC token); only this job holds it.
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --metadata-file on imagetools create needs a recent buildx.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Merge, sign and tag the multi-arch index
        # imagetools, not `docker manifest`: per-platform builds with
        # provenance/sbom push an OCI index, which `docker manifest create`
        # rejects.
        env:
          IMG_TAGS: ${{ needs.build-image.outputs.RAW_IMG_TAGS }}
          ISSUER: https://token.actions.githubusercontent.com
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Merge once, from the run's most specific tag (the full version on a tag run):
          # `latest-linux-*` is shared with dispatch runs and can be moved under us.
          read -ra TAGS <<< "$IMG_TAGS"
          SRC=${TAGS[1]:-${TAGS[0]}}
          for REPO in $REPOS; do
            # imagetools needs a tag to push to. Scratch tag, moved every run: never deploy it.
            docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" \
              -t "$REPO:unsigned-staging" \
              "$REPO:$SRC-linux-amd64" \
              "$REPO:$SRC-linux-arm64"
            DIGEST=$(jq -re '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
            # --recursive also signs each platform image: without it a pull by
            # platform digest has no signature.
            cosign sign --yes --recursive "${REPO}@${DIGEST}"
            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "${REPO}@${DIGEST}" >/dev/null
            # Public tags move only after the signature verifies.
            for IMG_TAG in $IMG_TAGS; do
              docker buildx imagetools create -t "$REPO:$IMG_TAG" "${REPO}@${DIGEST}"
              GOT=$(docker buildx imagetools inspect "$REPO:$IMG_TAG" --format '{{json .Manifest}}' | jq -r .digest)
              [[ "$GOT" == "$DIGEST" ]] || { echo "::error::$REPO:$IMG_TAG is $GOT, not the signed $DIGEST"; exit 1; }
              echo "signed $REPO:$IMG_TAG @ $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      # Use the preinstalled gh CLI instead of a third-party release action.
      # Only runs on tag pushes; skipped on workflow_dispatch against main.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            echo "Release ${GITHUB_REF_NAME} already exists; skipping."
          fi
